<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · MecánicaOS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2f3f0;
        color: #16202a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.8rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #45525f;
        line-height: 1.6;
      }
      button {
        margin-top: 1rem;
        background: #0b6b6b;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1418;
          color: #e9eef1;
        }
        p {
          color: #b6c2ca;
        }
        button {
          background: #3db5ac;
          color: #05201e;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión a internet</h1>
      <p>MecánicaOS necesita internet para mostrar los datos del taller. Revisa el wifi o los datos móviles y vuelve a intentarlo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
